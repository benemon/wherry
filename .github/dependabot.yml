version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      # kfake publishes no tags, so the module is pinned at a pseudo-version
      # dependabot cannot resolve; bump it by hand with franz-go.
      - dependency-name: github.com/twmb/franz-go/pkg/kfake

  - package-ecosystem: gomod
    directory: /adapter
    schedule:
      interval: weekly
    groups:
      go-adapter:
        patterns: ["*"]
