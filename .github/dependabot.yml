version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      # kfake publishes no tags, so the module is pinned at a pseudo-version
      # dependabot cannot resolve; bump it by hand with franz-go.
      - dependency-name: github.com/twmb/franz-go/pkg/kfake
      # nomad/api publishes no module tags, so it is pinned at a
      # pseudo-version dependabot cannot resolve; bump it by hand with the
      # nomad plugin's.
      - dependency-name: github.com/hashicorp/nomad/api

  - package-ecosystem: gomod
    directory: /pluginsdk
    schedule:
      interval: weekly
    groups:
      go-pluginsdk:
        patterns: ["*"]
