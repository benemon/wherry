name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            pluginsdk/go.sum
      - name: Run every gate
        run: make check

  proto:
    runs-on: ubuntu-latest
    env:
      BUF_VERSION: 1.75.0
      BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install the Buf CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v$BUF_VERSION/buf-Linux-x86_64"
          echo "$BUF_SHA256  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
      # The plugin protocol is released with the pluginsdk module, so the previous release is the newest pluginsdk/v*
      # tag reachable from the base: a pull request's head may itself carry the new protocol's pluginsdk tag.
      - name: Check the plugin protocol for breaking changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: |
          against=$(git describe --tags --abbrev=0 --match 'pluginsdk/v*' "$BASE")
          "$RUNNER_TEMP/buf" breaking pluginsdk --against ".git#tag=$against,subdir=pluginsdk"

  # promtool checks the shipped alert rules and runs routing.test.yml and counter-zero.test.yml in
  # contrib/observability against fixed series; make check needs no promtool.
  observability:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.15.1
      # prometheus-3.15.1.linux-amd64.tar.gz, from the release's sha256sums.txt
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install promtool
        run: |
          archive="prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$archive"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
      - name: Check the alert rules
        run: '"$RUNNER_TEMP/promtool" check rules contrib/observability/wherry-alerts.yaml'
      - name: Test the dashboard's Routing queries and counter increases
        run: '"$RUNNER_TEMP/promtool" test rules contrib/observability/routing.test.yml contrib/observability/counter-zero.test.yml'

  # One job per package, each with its own broker: the packages share wherry.operator, so they never share a broker.
  broker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [./internal/operator/, ./internal/receiver/, ./internal/client/, ./cmd/wherry/]
    name: broker (${{ matrix.package }})
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            pluginsdk/go.sum
      - name: Start Kafka
        run: test/kafka/up.sh "$RUNNER_TEMP/kafka"
      - name: Run the real-broker tests
        run: |
          . "$RUNNER_TEMP/kafka/env"
          go test -count=1 -timeout 30m ${{ matrix.package }}

  s3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            pluginsdk/go.sum
      - name: Start ceph-aio
        run: test/s3/up.sh "$RUNNER_TEMP/s3"
      - name: Run the S3 tests
        run: |
          . "$RUNNER_TEMP/s3/env"
          go test -count=1 ./internal/client/ ./cmd/wherry/
      - name: Show ceph-aio's log
        if: failure()
        run: docker logs --tail 200 wherry-ceph-aio

  # The broker job's suites on a three-node cluster (test/kafka/up-cluster.sh), where the multi-broker tests also run.
  broker-cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [./internal/operator/, ./internal/receiver/, ./internal/client/, ./cmd/wherry/]
    name: broker-cluster (${{ matrix.package }})
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            pluginsdk/go.sum
      - name: Start a three-broker Kafka cluster
        run: test/kafka/up-cluster.sh "$RUNNER_TEMP/kafka"
      - name: Run the real-broker tests
        run: |
          . "$RUNNER_TEMP/kafka/env"
          go test -count=1 -timeout 30m ${{ matrix.package }}
      - name: Show the brokers' logs
        if: failure()
        run: for node in 1 2 3; do docker logs --tail 200 "wherry-kafka-$node"; done

  # The release build as a snapshot, unsigned and unpublished: it fails when the archives or the files they hold differ
  # from .github/release-contents.txt.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser versions the snapshot from the newest v* tag.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            pluginsdk/go.sum
      - name: Install goreleaser, syft and cosign
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # goreleaser check fails on deprecated properties as well as invalid ones. brews, deprecated in favour of
      # homebrew_casks, stays until the move is decided; any other finding fails the job.
      - name: Check the goreleaser configuration
        run: |
          if out=$(goreleaser check 2>&1); then printf '%s\n' "$out"; exit 0; fi
          printf '%s\n' "$out"
          # goreleaser colours its output on the runner; the matches below read the plain text.
          out=$(printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$out" | grep -q 'configuration is valid, but uses deprecated properties' || exit 1
          if printf '%s\n' "$out" | grep 'DEPRECATED:' | grep -v -q 'DEPRECATED: *brews '; then exit 1; fi
          echo "valid; brews is the only deprecated property"
      - name: Build a snapshot release
        run: goreleaser release --snapshot --clean --skip=sign
      - name: Compare the archives with the last release's
        run: |
          .github/release-contents.sh dist | tee "$RUNNER_TEMP/release-contents.txt"
          diff -u .github/release-contents.txt "$RUNNER_TEMP/release-contents.txt"
