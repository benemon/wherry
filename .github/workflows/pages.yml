name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'brand/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'brand/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

env:
  # The wherry-plugins commit whose examples the Plugins page embeds and whose README install regions the Install pages
  # include; a plugin release moves it to the commit it was cut from.
  WHERRY_PLUGINS_REF: 7c90af415d794263533868655f41ea8f83712802

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Plugins page embeds the receiver examples from wherry-plugins, and the Install pages include the plugin READMEs.
      - name: Check out wherry-plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: benemon/wherry-plugins
          ref: ${{ env.WHERRY_PLUGINS_REF }}
          path: wherry-plugins
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-site
      - name: Build documentation
        env:
          WHERRY_PLUGINS_DIR: ${{ github.workspace }}/wherry-plugins
        run: make docs
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/.vitepress/dist
  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
