name: release

# A v* tag is the release act. Tags with a hyphenated qualifier (v0.1.0-rc.1)
# publish a prerelease. The build lives in .goreleaser.yaml, and ci.yml's
# release-build job runs it as a snapshot on every change. pluginsdk/v* tags
# version the plugin protocol module and publish nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Publishes only a commit whose push to main finished green. It queries
  # rather than re-runs. The tag reaches the shell through the environment
  # and is checked before use, since git accepts tag names that would escape
  # any quoting.
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=completed" \
            --jq '.workflow_runs[0].conclusion // "absent"')
          if [ "$conclusion" != "success" ]; then
            echo "ci for $sha concluded: $conclusion (need: success)." >&2
            echo "Tag a commit whose push to main finished green; 'absent' means no completed run exists yet." >&2
            exit 1
          fi
          echo "ci for $sha concluded success"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # release creation and asset upload
      id-token: write      # provenance attestation and keyless signing
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag and the previous one from the history.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Install goreleaser, syft and cosign
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # goreleaser builds, signs and uploads to a draft release, and writes the Homebrew formula to dist without pushing
      # it.
      - name: Build, sign and upload the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      # Verify with:
      #   gh attestation verify wherry_<tag>_<os>_<arch>.tar.gz -R benemon/wherry
      - name: Attest the archives' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/wherry_*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          gh release edit "$RELEASE_TAG" --draft=false
      # The formula is pushed over SSH, trusting only the host keys GitHub publishes, once the release its URLs name is
      # public.
      - name: Write GitHub's SSH host keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
      # The deploy key has write access to benemon/homebrew-tap alone; without the secret the formula is left alone.
      - name: Push the Homebrew formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then echo "no HOMEBREW_TAP_DEPLOY_KEY; the formula is left alone"; exit 0; fi
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          key="$RUNNER_TEMP/tap_deploy_key"
          (umask 077 && printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 --branch main git@github.com:benemon/homebrew-tap.git "$tap"
          cp dist/homebrew/Formula/wherry.rb "$tap/Formula/wherry.rb"
          git -C "$tap" add Formula/wherry.rb
          if git -C "$tap" diff --cached --quiet; then
            echo "Formula/wherry.rb already matches $RELEASE_TAG"
          else
            git -C "$tap" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "wherry $RELEASE_TAG"
            git -C "$tap" push origin HEAD:main
          fi
          rm -f "$key"
