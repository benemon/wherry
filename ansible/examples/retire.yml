# Decommissions the deployment site.yml built: every role with its state absent, which each role refuses without its
# own wherry_<role>_confirm_absent; confirm-absent.yml sets all eight. The operator directory goes into
# wherry_backup_dir and Kafka keeps wherry's objects; to clear them too, pass wherry_operator_clear_kafka=true with
# wherry_operator_kafka_bin_dir and wherry_operator_kafka_admin_config, which run Kafka's scripts and need Java 17 or
# later.
# ansible-playbook -i inventory.yml retire.yml -e @confirm-absent.yml
---
- name: Remove the Nomad and Kubernetes receivers
  hosts: controllers
  gather_facts: false
  roles:
    - role: benemon.wherry.nomad_receiver
      vars:
        wherry_nomad_receiver_state: absent
        wherry_nomad_receiver_name: wherry-receiver-nomad-1
        wherry_nomad_receiver_namespace: wherry
        wherry_nomad_receiver_node_pool: default
        # The receiver's agent runs are jobs of their own, which only the prefix purge removes.
        wherry_nomad_receiver_purge_prefix: true
        wherry_nomad_receiver_job_prefix: wherry-receiver
        wherry_nomad_receiver_agent_prefix: agent-
    - role: benemon.wherry.kubernetes_receiver
      vars:
        wherry_kubernetes_receiver_state: absent

- name: Remove the systemd receiver
  hosts: systemd_receivers
  gather_facts: false
  become: true
  roles:
    - role: benemon.wherry.systemd_receiver
      vars:
        wherry_systemd_receiver_state: absent

- name: Retire the host and the operator
  hosts: controllers
  gather_facts: false
  roles:
    - role: benemon.wherry.host
      vars:
        wherry_host_state: absent
    - role: benemon.wherry.operator
      vars:
        wherry_operator_state: absent

- name: Retire the Nomad and Kubernetes platforms
  hosts: controllers
  gather_facts: false
  roles:
    - role: benemon.wherry.nomad
      vars:
        wherry_nomad_state: absent
    - role: benemon.wherry.kubernetes
      vars:
        wherry_kubernetes_state: absent

- name: Retire the systemd platform
  hosts: systemd_receivers
  gather_facts: false
  become: true
  roles:
    - role: benemon.wherry.systemd
      vars:
        wherry_systemd_state: absent
