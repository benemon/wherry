argument_specs:
  main:
    short_description: Enrol a wherry host, or archive and clear its identity.
    description:
      - With wherry_host_state=present, enrols the host when the operator holds no bundle for it.
      - >-
        With wherry_host_state=absent, archives the host's state directory, bundle, host key, configuration and
        scram.next into wherry_host_backup_dir, then removes the state directory, bundle and host key and recreates an
        empty state directory.
      - >-
        The bundle, host key and state directory are those the configuration names, else the CLI's defaults for that
        configuration path: $XDG_STATE_HOME/wherry for the default configuration, <config>.state beside any other.
    options:
      wherry_host_state:
        type: str
        choices: [present, absent]
        default: present
        description: Whether the host should be enrolled or its identity cleared.
      wherry_host_confirm_absent:
        type: bool
        default: false
        description: Must be true for wherry_host_state=absent.
      wherry_host_name:
        type: str
        description: Host name; needed with state present.
      wherry_host_tenant:
        type: str
        description: Host tenant, by default wherry_tenant; needed with state present.
      wherry_host_operator_dir:
        type: path
        description: Operator directory, by default wherry_operator_dir; needed with state present.
      wherry_host_ca_cert:
        type: path
        description: Kafka CA certificate file for host init, by default wherry_ca_cert; needed with state present.
      wherry_host_config_dir:
        type: path
        description: Host configuration directory; unset, the host's $XDG_CONFIG_HOME/wherry, by default ~/.config/wherry.
      wherry_host_backup_dir:
        type: path
        description: Directory for the dated archive, by default wherry_backup_dir; needed with state absent.
  live:
    short_description: Wait for named receivers to be live to a wherry host; skipped in check mode.
    options:
      wherry_host_operator_dir:
        type: path
        description: Operator directory, by default wherry_operator_dir.
      wherry_host_config_dir:
        type: path
        description: Host configuration directory; unset, the host's $XDG_CONFIG_HOME/wherry.
      wherry_host_live_receivers:
        type: list
        elements: str
        required: true
        description: Receiver names that must report live.
