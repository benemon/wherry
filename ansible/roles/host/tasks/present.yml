---
- name: Check the arguments wherry_host_state=present needs
  ansible.builtin.assert:
    that:
      - wherry_host_name is not none
      - wherry_host_tenant is not none
      - wherry_host_operator_dir is not none
      - wherry_host_ca_cert is not none
    fail_msg: >-
      wherry_host_state=present needs wherry_host_name, _tenant, _operator_dir and _ca_cert (the last three default to
      wherry_tenant, wherry_operator_dir and wherry_ca_cert).
    quiet: true

- name: Inspect the host bundle
  ansible.builtin.stat:
    path: "{{ wherry_host_operator_dir }}/bundles/hosts/{{ wherry_host_tenant }}/{{ wherry_host_name }}.bundle"
  register: __wherry_host_bundle

- name: Enrol a new host credential
  when: not __wherry_host_bundle.stat.exists
  block:
    - name: Add the host
      ansible.builtin.command:
        argv: [wherry, operator, add, --host, "{{ wherry_host_name }}", --tenant, "{{ wherry_host_tenant }}", --dir, "{{ wherry_host_operator_dir }}"]
      changed_when: true

    - name: Initialise the host
      ansible.builtin.command:
        argv:
          - wherry
          - host
          - init
          - --config-file
          - "{{ __wherry_host_config }}"
          - --ca-cert
          - "@{{ wherry_host_ca_cert }}"
          - "{{ wherry_host_operator_dir }}/bundles/hosts/{{ wherry_host_tenant }}/{{ wherry_host_name }}.bundle"
      register: __wherry_host_initialisation
      changed_when: true
      no_log: true

    # Check mode runs neither command above, so there is no request to approve.
    - name: Approve the enrolment request
      when: not ansible_check_mode
      block:
        - name: Check the enrolment request
          ansible.builtin.assert:
            that: __wherry_host_initialisation.stderr is regex('request [0-9a-f]{32} sent')
            fail_msg: Host initialisation did not report an enrolment request ID.
            quiet: true

        - name: Keep the enrolment request ID
          ansible.builtin.set_fact:
            __wherry_host_request_id: "{{ __wherry_host_initialisation.stderr | regex_search('request ([0-9a-f]{32}) sent', '\\1') | first }}"

        - name: Approve the enrolment request
          ansible.builtin.command:
            argv: [wherry, operator, approve, "{{ __wherry_host_request_id }}", --dir, "{{ wherry_host_operator_dir }}"]
          register: __wherry_host_approval
          until: ('approved ' ~ __wherry_host_request_id) in __wherry_host_approval.stdout
          retries: 3
          delay: 10
          changed_when: true
