---
- name: Check the arguments state=present needs
  ansible.builtin.assert:
    that:
      - wherry_host is defined
      - wherry_host_tenant is defined
      - wherry_operator_dir is defined
      - wherry_host_ca_cert is defined
    fail_msg: state=present needs wherry_host, wherry_host_tenant, wherry_operator_dir and wherry_host_ca_cert.
    quiet: true

- name: Inspect the host bundle
  ansible.builtin.stat:
    path: "{{ wherry_operator_dir }}/bundles/hosts/{{ wherry_host_tenant }}/{{ wherry_host }}.bundle"
  register: _wherry_host_bundle

- name: Enrol a new host credential
  when: not _wherry_host_bundle.stat.exists
  block:
    - name: Add the host
      ansible.builtin.command:
        argv:
          - wherry
          - operator
          - add
          - --host
          - "{{ wherry_host }}"
          - --tenant
          - "{{ wherry_host_tenant }}"
          - --dir
          - "{{ wherry_operator_dir }}"
      changed_when: true

    - name: Initialise the host
      ansible.builtin.command:
        argv:
          - wherry
          - host
          - init
          - --config-file
          - "{{ _wherry_host_config }}"
          - --ca-cert
          - "@{{ wherry_host_ca_cert }}"
          - "{{ wherry_operator_dir }}/bundles/hosts/{{ wherry_host_tenant }}/{{ wherry_host }}.bundle"
      register: _wherry_host_initialisation
      changed_when: true
      no_log: true

    - name: Check the enrolment request
      ansible.builtin.assert:
        that: _wherry_host_initialisation.stderr is regex('request [0-9a-f]{32} sent')
        fail_msg: Host initialisation did not report an enrolment request ID.
        quiet: true

    - name: Keep the enrolment request ID
      ansible.builtin.set_fact:
        _wherry_host_request_id: "{{ _wherry_host_initialisation.stderr | regex_search('request ([0-9a-f]{32}) sent', '\\1') | first }}"

    - name: Approve the enrolment request
      ansible.builtin.command:
        argv: [wherry, operator, approve, "{{ _wherry_host_request_id }}", --dir, "{{ wherry_operator_dir }}"]
      register: _wherry_host_approval
      until: ('approved ' ~ _wherry_host_request_id) in _wherry_host_approval.stdout
      retries: 3
      delay: 10
      changed_when: true
