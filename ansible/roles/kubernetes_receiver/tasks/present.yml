---
- name: Check the arguments state=present needs
  ansible.builtin.assert:
    that:
      - wherry_kubernetes_receiver_name is defined
      - wherry_kubernetes_receiver_image is defined
      - wherry_kubernetes_receiver_bundle is defined
      - wherry_kubernetes_receiver_config is defined
    fail_msg: state=present needs wherry_kubernetes_receiver_name, _image, _bundle and _config.
    quiet: true

- name: Check the Kubernetes plugin version is pinned
  ansible.builtin.assert:
    that: wherry_plugin_version in _wherry_kubernetes_plugin_commits
    fail_msg: "Unsupported Kubernetes plugin version {{ wherry_plugin_version }}."
    quiet: true

- name: Check the receiver image names a tag or digest
  ansible.builtin.assert:
    that: wherry_kubernetes_receiver_image is regex('(:[^/:@]+|@sha256:[0-9a-f]{64})$')
    fail_msg: "Receiver image {{ wherry_kubernetes_receiver_image }} names no tag or digest."
    quiet: true

- name: Create the Kubernetes render directory
  ansible.builtin.tempfile:
    state: directory
    prefix: "wherry-{{ wherry_kubernetes_receiver_name }}."
  register: _wherry_kubernetes_render_dir
  delegate_to: localhost
  check_mode: false
  changed_when: false

- name: Render and deploy the Kubernetes receiver
  block:
    - name: Create the Kubernetes example directory
      ansible.builtin.file:
        path: "{{ _wherry_kubernetes_render_dir.path }}/base"
        state: directory
        mode: "0700"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Fetch the pinned Kubernetes examples
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/benemon/wherry-plugins/{{ _wherry_kubernetes_plugin_commits[wherry_plugin_version] }}/examples/kubernetes/{{ item }}
        dest: "{{ _wherry_kubernetes_render_dir.path }}/base/{{ item }}"
        mode: "0600"
      loop:
        - kustomization.yaml
        - receiver.yaml
        - fsgroup.yaml
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Install the receiver bundle in the base
      ansible.builtin.copy:
        content: "{{ wherry_kubernetes_receiver_bundle }}"
        dest: "{{ _wherry_kubernetes_render_dir.path }}/base/receiver.bundle"
        mode: "0600"
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Install the applied receiver configuration in the base
      ansible.builtin.copy:
        content: "{{ wherry_kubernetes_receiver_config | to_nice_yaml(indent=2, sort_keys=false) }}"
        dest: "{{ _wherry_kubernetes_render_dir.path }}/base/config.yaml"
        mode: "0600"
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Write Kubernetes overlay resources
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ _wherry_kubernetes_render_dir.path }}/{{ item | basename }}"
        mode: "0600"
      loop: >-
        {{ wherry_kubernetes_overlay_resources +
        (wherry_kubernetes_overlay_patches | reject('match', '^base/')) }}
      loop_control:
        label: "{{ item }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Start the Kubernetes patch list
      ansible.builtin.set_fact:
        _wherry_kubernetes_patch_refs: []

    - name: Add Kubernetes overlay patches
      ansible.builtin.set_fact:
        _wherry_kubernetes_patch_refs: >-
          {{ _wherry_kubernetes_patch_refs +
          [{'path': (item if item is match('^base/') else item | basename)}] }}
      loop: "{{ wherry_kubernetes_overlay_patches }}"
      loop_control:
        label: "{{ item }}"

    # The base's images entry has already renamed the image, so the overlay matches the base's newName and newTag.
    - name: Write the Kubernetes overlay
      ansible.builtin.copy:
        content: "{{ _wherry_kubernetes_kustomization | to_nice_yaml(indent=2, sort_keys=false) }}"
        dest: "{{ _wherry_kubernetes_render_dir.path }}/kustomization.yaml"
        mode: "0600"
      vars:
        _wherry_kubernetes_base_image: >-
          {{ (lookup('ansible.builtin.file', _wherry_kubernetes_render_dir.path ~ '/base/kustomization.yaml') | from_yaml).images |
          selectattr('name', 'equalto', 'wherry-receiver') | first }}
        _wherry_kubernetes_image: "{{ wherry_kubernetes_receiver_image | regex_findall(_wherry_kubernetes_image_pattern) | first }}"
        _wherry_kubernetes_image_pattern: '^([^@]+?)(?::([^/:@]+))?(?:@(sha256:[0-9a-f]{64}))?$'
        _wherry_kubernetes_kustomization:
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: "{{ wherry_kubernetes_namespace }}"
          resources: "{{ ['base'] + (wherry_kubernetes_overlay_resources | map('basename')) }}"
          images:
            - "{{ {'name': _wherry_kubernetes_base_image.newName ~ ':' ~ _wherry_kubernetes_base_image.newTag,
                   'newName': _wherry_kubernetes_image[0]} |
                 combine({'newTag': _wherry_kubernetes_image[1]} if _wherry_kubernetes_image[1] else {}) |
                 combine({'digest': _wherry_kubernetes_image[2]} if _wherry_kubernetes_image[2] else {}) }}"
          patches: "{{ _wherry_kubernetes_patch_refs }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Build the Kubernetes receiver manifests
      ansible.builtin.set_fact:
        _wherry_kubernetes_receiver_render: >-
          {{ lookup('kubernetes.core.kustomize', dir=_wherry_kubernetes_render_dir.path, binary_path='kubectl') }}
      no_log: true

    - name: Apply Kubernetes receiver secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ wherry_kubernetes_kubeconfig }}"
        state: present
        definition: >-
          {{ _wherry_kubernetes_receiver_render | from_yaml_all |
          selectattr('kind', 'equalto', 'Secret') | list }}
      no_log: true

    # The ConfigMap carries the receiver's config, which the argument spec marks no_log.
    - name: Apply Kubernetes receiver resources
      kubernetes.core.k8s:
        kubeconfig: "{{ wherry_kubernetes_kubeconfig }}"
        state: present
        definition: >-
          {{ _wherry_kubernetes_receiver_render | from_yaml_all |
          rejectattr('kind', 'equalto', 'Secret') | list }}
      no_log: true

    - name: Wait for the Kubernetes receiver rollout
      kubernetes.core.k8s_info:
        kubeconfig: "{{ wherry_kubernetes_kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        name: wherry-receiver
        namespace: "{{ wherry_kubernetes_namespace }}"
      register: _wherry_kubernetes_receiver_deployment
      until:
        - _wherry_kubernetes_receiver_deployment.resources | length == 1
        - >-
          _wherry_kubernetes_receiver_deployment.resources[0].status.observedGeneration | default(0) ==
          _wherry_kubernetes_receiver_deployment.resources[0].metadata.generation
        - >-
          _wherry_kubernetes_receiver_deployment.resources[0].status.updatedReplicas | default(0) ==
          _wherry_kubernetes_receiver_deployment.resources[0].spec.replicas
      retries: 60
      delay: 5

  always:
    - name: Remove the Kubernetes render directory
      ansible.builtin.file:
        path: "{{ _wherry_kubernetes_render_dir.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true
