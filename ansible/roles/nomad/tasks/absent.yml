---
- name: Check the arguments state=absent needs
  ansible.builtin.assert:
    that: wherry_nomad_policy_prefix is defined and wherry_nomad_policy_prefix is match('wherry')
    fail_msg: state=absent needs a wherry_nomad_policy_prefix that starts with wherry.
    quiet: true

- name: Remove wherry from Nomad
  module_defaults:
    group/benemon.nomad.nomad:
      address: "{{ wherry_nomad_address }}"
      ca_cert: "{{ wherry_nomad_ca_cert | default(omit) }}"
      token: "{{ wherry_nomad_token }}"
  block:
    - name: List Nomad ACL policies
      benemon.nomad.nomad_acl_policy_info:
      register: _wherry_nomad_policies

    - name: Delete wherry receiver policies
      benemon.nomad.nomad_acl_policy:
        name: "{{ item.Name }}"
        state: absent
      loop: "{{ _wherry_nomad_policies.policies | selectattr('Name', 'match', wherry_nomad_policy_prefix | regex_escape) }}"
      loop_control:
        label: "{{ item.Name }}"

    - name: Delete wherry Nomad namespaces
      benemon.nomad.nomad_namespace:
        name: "{{ item }}"
        state: absent
      loop: "{{ wherry_nomad_namespaces | map(attribute='name') }}"
