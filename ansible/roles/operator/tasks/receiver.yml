---
- name: Create plugin directories for {{ _wherry_receiver.name }}
  ansible.builtin.file:
    path: "{{ wherry_operator_dir }}/receivers/{{ _wherry_receiver.name }}/plugins/{{ item.key }}/profiles"
    state: directory
    mode: "0700"
  loop: "{{ _wherry_receiver.plugins | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Write plugin configurations for {{ _wherry_receiver.name }}
  ansible.builtin.copy:
    content: >-
      {{ item.value | dict2items | rejectattr('key', 'equalto', 'profiles') |
      items2dict | to_nice_yaml(indent=2, sort_keys=false) }}
    dest: "{{ wherry_operator_dir }}/receivers/{{ _wherry_receiver.name }}/plugins/{{ item.key }}/plugin.yaml"
    mode: "0600"
  loop: "{{ _wherry_receiver.plugins | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Start the plugin profile path list for {{ _wherry_receiver.name }}
  ansible.builtin.set_fact:
    _wherry_receiver_profile_paths: []

- name: Add plugin profile paths for {{ _wherry_receiver.name }}
  ansible.builtin.set_fact:
    _wherry_receiver_profile_paths: >-
      {{ _wherry_receiver_profile_paths +
      [wherry_operator_dir ~ '/receivers/' ~ _wherry_receiver.name ~ '/plugins/' ~ item.0.key ~ '/profiles/' ~
      ('%02d' | format(_wherry_profile_index + 1)) ~ '-' ~ item.1.name ~ '.yaml'] }}
  loop: "{{ query('ansible.builtin.subelements', _wherry_receiver.plugins | dict2items, 'value.profiles') }}"
  loop_control:
    index_var: _wherry_profile_index
    label: "{{ item.0.key }}/{{ item.1.name }}"

- name: Write plugin profiles for {{ _wherry_receiver.name }}
  ansible.builtin.copy:
    content: "{{ item.1 | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ _wherry_receiver_profile_paths[_wherry_profile_index] }}"
    mode: "0600"
  loop: "{{ query('ansible.builtin.subelements', _wherry_receiver.plugins | dict2items, 'value.profiles') }}"
  loop_control:
    index_var: _wherry_profile_index
    label: "{{ item.0.key }}/{{ item.1.name }}"
  no_log: true

- name: Find plugin profiles for {{ _wherry_receiver.name }}
  ansible.builtin.find:
    paths: "{{ wherry_operator_dir }}/receivers/{{ _wherry_receiver.name }}/plugins"
    patterns: '*.yaml'
    recurse: true
    file_type: file
  register: _wherry_receiver_profile_files

- name: Remove stale plugin profiles for {{ _wherry_receiver.name }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _wherry_receiver_profile_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - item.path | basename != 'plugin.yaml'
    - item.path not in _wherry_receiver_profile_paths

- name: Find plugin directories for {{ _wherry_receiver.name }}
  ansible.builtin.find:
    paths: "{{ wherry_operator_dir }}/receivers/{{ _wherry_receiver.name }}/plugins"
    file_type: directory
    recurse: false
  register: _wherry_receiver_plugin_directories

- name: Remove stale plugin directories for {{ _wherry_receiver.name }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _wherry_receiver_plugin_directories.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename not in _wherry_receiver.plugins
