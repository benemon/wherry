---
- name: Inspect the receiver service unit
  ansible.builtin.stat:
    path: /etc/systemd/system/wherry-receiver.service
  register: _wherry_systemd_receiver_unit

- name: Stop and disable the receiver service
  ansible.builtin.systemd_service:
    name: wherry-receiver
    state: stopped
    enabled: false
  when: _wherry_systemd_receiver_unit.stat.exists

- name: Remove the receiver platform files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/wherry-receiver.service
    - /etc/systemd/system/wherry.slice
    - /etc/tmpfiles.d/wherry.conf
    - /etc/wherry
    - /var/lib/wherry
    - /var/lib/private/wherry-agents
    - /var/lib/wherry-agents
    - /run/wherry-systemd
    - /run/wherry/credentials
    - /wherry
    - /usr/local/libexec/wherry
    - /usr/local/bin/wherry

- name: Reload systemd after retirement
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _wherry_systemd_receiver_unit.stat.exists
