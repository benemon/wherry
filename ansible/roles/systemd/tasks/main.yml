---
- name: Refuse state=absent without wherry_confirm_absent
  ansible.builtin.assert:
    that: state == 'present' or wherry_confirm_absent | bool
    fail_msg: state=absent stops the receiver and removes the platform's files and state; set wherry_confirm_absent to true to proceed.
    quiet: true

- name: Apply the systemd platform's state
  ansible.builtin.include_tasks: "{{ state }}.yml"
