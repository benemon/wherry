---
- name: Check the arguments state=present needs
  ansible.builtin.assert:
    that:
      - wherry_version is defined
      - wherry_plugin_version is defined
      - wherry_systemd_receiver_plugin_sha256 is defined
      - wherry_systemd_receiver_config is defined
      - wherry_systemd_receiver_bundle is defined
    fail_msg: >-
      state=present needs wherry_version, wherry_plugin_version and wherry_systemd_receiver_plugin_sha256, _config and
      _bundle.
    quiet: true

- name: Check the systemd plugin version is pinned
  ansible.builtin.assert:
    that: wherry_plugin_version in _wherry_systemd_receiver_plugin_commits
    fail_msg: "Unsupported systemd plugin version {{ wherry_plugin_version }}."
    quiet: true

- name: Set the systemd receiver release directories
  ansible.builtin.set_fact:
    _wherry_systemd_wherry_dir: "{{ wherry_systemd_receiver_cache_dir }}/wherry/{{ wherry_version }}"
    _wherry_systemd_plugin_dir: "{{ wherry_systemd_receiver_cache_dir }}/wherry-plugin-systemd/{{ wherry_plugin_version }}"

# Each release's checksums.txt is verified with cosign against the release workflow at that release's own tag, each
# archive against its checksums.txt, and each archive unpacks only its binary into its own release's directory.
- name: Stage the wherry and systemd plugin releases
  ansible.builtin.include_tasks: release.yml
  args:
    apply:
      delegate_to: localhost
      run_once: true
      become: false
  loop:
    - dir: "{{ _wherry_systemd_wherry_dir }}"
      url: "https://github.com/benemon/wherry/releases/download/{{ wherry_version }}"
      identity: "^https://github[.]com/benemon/wherry/[.]github/workflows/release[.]yml@refs/tags/{{ wherry_version | regex_escape }}$"
      archive: "wherry_{{ wherry_version }}_linux_amd64"
      binary: wherry
    - dir: "{{ _wherry_systemd_plugin_dir }}"
      url: "https://github.com/benemon/wherry-plugins/releases/download/systemd/v{{ wherry_plugin_version }}"
      identity: >-
        ^https://github[.]com/benemon/wherry-plugins/[.]github/workflows/release[.]yml@refs/tags/systemd/v{{ wherry_plugin_version | regex_escape }}$
      archive: "wherry-plugin-systemd_v{{ wherry_plugin_version }}_linux_amd64"
      binary: wherry-plugin-systemd
  loop_control:
    loop_var: _wherry_release
    label: "{{ _wherry_release.archive }}"

- name: Inspect the systemd plugin checksum
  ansible.builtin.stat:
    path: "{{ _wherry_systemd_plugin_dir }}/bin/wherry-plugin-systemd"
    checksum_algorithm: sha256
  register: _wherry_systemd_plugin_binary
  delegate_to: localhost
  run_once: true
  become: false

- name: Check the systemd plugin checksum
  ansible.builtin.assert:
    that: _wherry_systemd_plugin_binary.stat.checksum == wherry_systemd_receiver_plugin_sha256
    fail_msg: The systemd plugin binary does not match its receiver pin.
    quiet: true

- name: Create the versioned receiver directory
  ansible.builtin.file:
    path: "/usr/local/libexec/wherry/{{ wherry_version }}/plugins"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the receiver binaries
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - source: "{{ _wherry_systemd_wherry_dir }}/bin/wherry"
      destination: "/usr/local/libexec/wherry/{{ wherry_version }}/wherry"
    - source: "{{ _wherry_systemd_plugin_dir }}/bin/wherry-plugin-systemd"
      destination: "/usr/local/libexec/wherry/{{ wherry_version }}/plugins/wherry-plugin-systemd"
  notify: Restart wherry-receiver

- name: Select the receiver release
  ansible.builtin.file:
    src: "/usr/local/libexec/wherry/{{ wherry_version }}"
    dest: /usr/local/libexec/wherry/current
    state: link
    force: true
  notify: Restart wherry-receiver

- name: Link the wherry command
  ansible.builtin.file:
    src: /usr/local/libexec/wherry/current/wherry
    dest: /usr/local/bin/wherry
    state: link
    force: true

- name: Restore receiver binary labels
  ansible.builtin.command:
    argv: [restorecon, -Rv, /usr/local/bin, /usr/local/libexec/wherry]
  register: _wherry_systemd_restorecon
  changed_when: _wherry_systemd_restorecon.stdout | length > 0
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Install the receiver configuration
  ansible.builtin.copy:
    content: "{{ wherry_systemd_receiver_config | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: /etc/wherry/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart wherry-receiver
  no_log: true

- name: Install the receiver bundle
  ansible.builtin.copy:
    content: "{{ wherry_systemd_receiver_bundle }}"
    dest: /etc/wherry/receiver.bundle
    owner: root
    group: root
    mode: "0600"
  notify: Restart wherry-receiver
  no_log: true

- name: Start the receiver service
  ansible.builtin.systemd_service:
    name: wherry-receiver
    state: started
