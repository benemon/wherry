---
- name: Create the release directory for {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.file:
    path: "{{ __wherry_systemd_receiver_release.dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, unpack]
  check_mode: false

- name: Fetch the checksums and signature for {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.get_url:
    url: "{{ __wherry_systemd_receiver_release.url }}/{{ item }}"
    dest: "{{ __wherry_systemd_receiver_release.dir }}/{{ item }}"
    mode: "0600"
  loop: [checksums.txt, checksums.txt.sigstore.json]
  check_mode: false

- name: Verify the checksums for {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.command:
    argv:
      - cosign
      - verify-blob
      - "{{ __wherry_systemd_receiver_release.dir }}/checksums.txt"
      - --bundle
      - "{{ __wherry_systemd_receiver_release.dir }}/checksums.txt.sigstore.json"
      - --certificate-identity-regexp
      - "{{ __wherry_systemd_receiver_release.identity }}"
      - --certificate-oidc-issuer
      - https://token.actions.githubusercontent.com
  check_mode: false
  changed_when: false

- name: Fetch the checked archive for {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.get_url:
    url: "{{ __wherry_systemd_receiver_release.url }}/{{ __wherry_systemd_receiver_release.archive }}.tar.gz"
    dest: "{{ __wherry_systemd_receiver_release.dir }}/{{ __wherry_systemd_receiver_release.archive }}.tar.gz"
    checksum: >-
      sha256:{{ (lookup('ansible.builtin.file', __wherry_systemd_receiver_release.dir ~ '/checksums.txt').splitlines() |
      select('search', '  ' ~ (__wherry_systemd_receiver_release.archive | regex_escape) ~ '[.]tar[.]gz$') | first).split()[0] }}
    mode: "0600"
  check_mode: false

# Each run unpacks the archive get_url has just checked into a scratch directory; the copy into bin/ reports the change.
- name: Unpack the binary {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - "{{ __wherry_systemd_receiver_release.dir }}/{{ __wherry_systemd_receiver_release.archive }}.tar.gz"
      - --strip-components=1
      - -C
      - "{{ __wherry_systemd_receiver_release.dir }}/unpack"
      - "{{ __wherry_systemd_receiver_release.archive }}/{{ __wherry_systemd_receiver_release.binary }}"
  check_mode: false
  changed_when: false

- name: Keep the binary {{ __wherry_systemd_receiver_release.binary }}
  ansible.builtin.copy:
    src: "{{ __wherry_systemd_receiver_release.dir }}/unpack/{{ __wherry_systemd_receiver_release.binary }}"
    dest: "{{ __wherry_systemd_receiver_release.dir }}/bin/{{ __wherry_systemd_receiver_release.binary }}"
    remote_src: true
    mode: "0755"
  check_mode: false
