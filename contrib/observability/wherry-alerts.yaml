# Prometheus alerting rules for wherry receivers. Each rule's runbook_url names its section of
# https://benemon.github.io/wherry/runbooks. The rules match the scrape job `wherry-receiver` of the operator guide's
# Metrics section; change `job` in WherryReceiverNotAdvertising when your scrape job has another name.
groups:
  - name: wherry
    rules:
      # A receiver advertises every 30 seconds, and hosts show it stale after 120 seconds without one. A receiver
      # that has not read its configuration exports no advertisement time.
      - alert: WherryReceiverNotAdvertising
        expr: |
          up{job="wherry-receiver"} == 0
          or time() - wherry_advertised_timestamp_seconds > 120
          or (wherry_build_info unless on (job, instance) wherry_advertised_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Receiver {{ $labels.instance }} has had no advertisement acknowledged for 120 seconds
          description: Hosts stop placing tasks on a receiver whose advertisement is older than 120 seconds.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherryreceivernotadvertising

      # At a run's task_ended_by, or the 6h run cap, the receiver stops its job and ends the run. A held run stays
      # past it while that stop or the run's terminal commit has not returned.
      - alert: WherryRunStuckPastDeadline
        expr: |
          sum by (job, instance, pool, profile) (wherry_runs_past_deadline) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Receiver {{ $labels.instance }} holds runs of profile {{ $labels.profile }} past their task_ended_by
          description: A run held past its task_ended_by stays TASK_STATE_WORKING until the receiver stops its job and ends it.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherryrunstuckpastdeadline

      - alert: WherryDeliveryBudgetExhausted
        expr: |
          sum by (pool, tenant, profile) (increase(wherry_delivery_budget_exhausted_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Runs of tenant {{ $labels.tenant }} in pool {{ $labels.pool }} spent their delivery budget
          description: Runs end TASK_STATE_FAILED with "delivery budget exhausted" when no receiver can start them.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherrydeliverybudgetexhausted

      - alert: WherryCredentialRequestsUnanswered
        expr: |
          sum by (pool, tenant) (increase(wherry_seal_waits_total{outcome="unanswered"}[1h])) >= 2
        labels:
          severity: warning
        annotations:
          summary: Tenant {{ $labels.tenant }} left seal requests in pool {{ $labels.pool }} unanswered
          description: A run whose seal request no host answers within 5 minutes ends TASK_STATE_FAILED.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherrycredentialrequestsunanswered

      # The receiver restarts an exited plugin after one second, doubling the wait after each failed start up to
      # 30 seconds.
      - alert: WherryPluginRestartLoop
        expr: |
          sum by (job, instance, pool, type) (increase(wherry_plugin_restarts_total[15m])) >= 3
        labels:
          severity: critical
        annotations:
          summary: Plugin {{ $labels.type }} on receiver {{ $labels.instance }} keeps restarting
          description: While a plugin is down its profiles are not ready and the receiver withdraws their offers.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherrypluginrestartloop

      - alert: WherryPlatformErrorsRising
        expr: |
          sum by (job, instance, pool, profile, class) (increase(wherry_plugin_platform_errors_total[10m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Profile {{ $labels.profile }} on receiver {{ $labels.instance }} is getting {{ $labels.class }} platform errors
          description: The plugin's platform API calls keep failing, which fails dispatches, stops, purges and sweeps.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherryplatformerrorsrising

      - alert: WherryBrokerUnreachable
        expr: |
          sum by (job, instance, pool) (increase(wherry_bus_errors_total{op=~"read|share group"}[5m])) >= 3
          or sum by (job, instance, pool) (increase(wherry_renewal_failures_total[5m])) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Receiver {{ $labels.instance }} cannot reach the Kafka brokers
          description: A receiver that cannot read or renew its claims loses them after the pool's lock duration.
          runbook_url: https://benemon.github.io/wherry/runbooks#wherrybrokerunreachable
