<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Outfit, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Pool keys and the key custodian</title>
  <desc id="desc">Every receiver of a pool joins the pool's custodian group. Kafka assigns the group's one partition to one member, which becomes the key custodian. The custodian holds the pool's private keys and publishes signed snapshots with the matching public keys to the pool's snapshot topic. Hosts of entitled tenants read the latest snapshot and wrap each task's content key to the current public key. The other receivers hold no current key; a former custodian keeps its old keys only to re-key tasks still under them. The custodian rotates the key about every 24 hours, and keeps a replaced key only until the last task under it can no longer start, then deletes it. When the custodian stops, Kafka assigns the partition to another member, which takes over, publishes a new key and raises the takeover alert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e4a35"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#f4f1e8"/>

  <!-- pool -->
  <rect x="40" y="40" width="560" height="340" rx="10" fill="#fffdf7" stroke="#3f6b4a" stroke-width="1.5"/>
  <text x="60" y="68" font-size="14" font-weight="600" fill="#00290b">Pool: its receivers form the custodian group</text>

  <g font-size="12" fill="#00290b">
    <rect x="70" y="92" width="240" height="130" rx="8" fill="#e6ede2" stroke="#3f6b4a" stroke-width="1.5"/>
    <text x="86" y="116" font-weight="600">Receiver A: key custodian</text>
    <text x="86" y="136" font-size="11">Assigned the group's one partition.</text>
    <text x="86" y="156" font-size="11">Holds the pool's private keys:</text>
    <text x="100" y="176" font-size="11" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace">current</text>
    <text x="100" y="194" font-size="11" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace">previous, until its deadline</text>
    <text x="86" y="212" font-size="10.5" fill="#3f6b4a">Opens envelopes to check them.</text>

    <rect x="340" y="92" width="230" height="58" rx="8" fill="#fffdf7" stroke="#b7c0b0" stroke-width="1.5"/>
    <text x="356" y="116" font-weight="600">Receiver B</text>
    <text x="356" y="136" font-size="11">Group member; no current key.</text>

    <rect x="340" y="164" width="230" height="58" rx="8" fill="#fffdf7" stroke="#b7c0b0" stroke-width="1.5"/>
    <text x="356" y="188" font-weight="600">Receiver C</text>
    <text x="356" y="208" font-size="11">Group member; no current key.</text>

    <text x="70" y="262" font-size="11.5" font-weight="600">Takeover</text>
    <text x="70" y="282" font-size="11">When A stops, Kafka assigns the partition to B or C.</text>
    <text x="70" y="300" font-size="11">The new custodian publishes a new key, fences A's writes</text>
    <text x="70" y="318" font-size="11">through the shared transactional ID, and every custodian</text>
    <text x="70" y="336" font-size="11">change raises WherryCustodianTakeover. A former custodian</text>
    <text x="70" y="354" font-size="11">keeps its old keys only to re-key tasks still under them.</text>
  </g>

  <!-- snapshot topic -->
  <g font-size="12" fill="#00290b">
    <rect x="680" y="92" width="240" height="130" rx="8" fill="#fffdf7" stroke="#3f6b4a" stroke-width="1.5"/>
    <text x="696" y="116" font-weight="600">Snapshot topic</text>
    <text x="696" y="134" font-size="10" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2e4a35">wherry.pool.&lt;pool&gt;.custodian</text>
    <text x="696" y="158" font-size="11">Signed snapshots: public keys</text>
    <text x="696" y="176" font-size="11">only, with the reason: bootstrap,</text>
    <text x="696" y="194" font-size="11">rotation, takeover or contested.</text>
  </g>
  <line x1="310" y1="157" x2="674" y2="157" stroke="#2e4a35" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="640" y="150" font-size="11" fill="#00290b" text-anchor="middle">publishes</text>

  <!-- hosts -->
  <g font-size="12" fill="#00290b">
    <rect x="980" y="92" width="170" height="130" rx="8" fill="#fffdf7" stroke="#b7c0b0" stroke-width="1.5"/>
    <text x="996" y="116" font-weight="600">Hosts</text>
    <text x="996" y="136" font-size="11">of entitled tenants</text>
    <text x="996" y="160" font-size="11">Read the latest</text>
    <text x="996" y="178" font-size="11">snapshot and wrap</text>
    <text x="996" y="196" font-size="11">each task's content</text>
    <text x="996" y="214" font-size="11">key to the current key.</text>
  </g>
  <line x1="920" y1="158" x2="974" y2="158" stroke="#2e4a35" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="947" y="150" font-size="11" fill="#00290b" text-anchor="middle">reads</text>

  <!-- rotation timeline -->
  <g font-size="12" fill="#00290b">
    <text x="40" y="420" font-size="14" font-weight="600">Rotation</text>
    <line x1="60" y1="470" x2="1140" y2="470" stroke="#2e4a35" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="1140" y="492" font-size="11" text-anchor="end">time</text>

    <rect x="60" y="440" width="420" height="22" rx="4" fill="#cfdccb" stroke="#3f6b4a"/>
    <text x="72" y="456" font-size="11">key 1 current: new tasks wrap to it</text>
    <rect x="480" y="440" width="300" height="22" rx="4" fill="#efeadb" stroke="#b7c0b0"/>
    <text x="492" y="456" font-size="11">key 1 kept for tasks already under it</text>

    <rect x="480" y="496" width="420" height="22" rx="4" fill="#cfdccb" stroke="#3f6b4a"/>
    <text x="492" y="512" font-size="11">key 2 current</text>
    <rect x="900" y="496" width="220" height="22" rx="4" fill="#efeadb" stroke="#b7c0b0"/>
    <text x="912" y="512" font-size="11">key 2 kept</text>

    <line x1="480" y1="430" x2="480" y2="530" stroke="#3f6b4a" stroke-dasharray="3 4"/>
    <text x="480" y="550" font-size="11" text-anchor="middle">rotation: about every 24 hours</text>
    <line x1="780" y1="430" x2="780" y2="474" stroke="#3f6b4a" stroke-dasharray="3 4"/>
    <text x="780" y="586" font-size="11" text-anchor="middle">key 1 deleted once no task under it can still start</text>
    <line x1="780" y1="474" x2="780" y2="572" stroke="#3f6b4a" stroke-dasharray="3 4"/>
  </g>
</svg>
